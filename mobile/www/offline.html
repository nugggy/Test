<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Support Buddy - you're offline</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fdf6ee; color: #3a2520; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  .mark { width: 72px; height: 72px; margin-bottom: 20px; }
  h1 { font-size: 1.75rem; margin: 0 0 12px; }
  p { font-size: 1.125rem; line-height: 1.5; margin: 0 0 24px; color: #75564e; }
  button { min-width: 88px; min-height: 88px; padding: 0 32px; border: 0; border-radius: 16px; background: #c23b37; color: #fff; font-size: 1.25rem; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 4px solid #f5b324; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg class="mark" aria-hidden="true" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#c23b37"/><circle cx="64" cy="64" r="42" fill="#fff"/><circle cx="49" cy="56" r="4.5" fill="#c23b37"/><circle cx="79" cy="56" r="4.5" fill="#c23b37"/><path d="M47 74 Q64 88 81 74" fill="none" stroke="#c23b37" stroke-width="7" stroke-linecap="round"/></svg>
  <h1>You're offline</h1>
  <p>My Support Buddy needs an internet connection the first time it opens. Tools you have opened before will keep working offline once they're loaded.</p>
  <button type="button" onclick="location.replace('https://tools.dunns.cc/')">Try again</button>
</main>
</body>
</html>
