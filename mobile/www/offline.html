<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolkit - you're offline</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f5; color: #16302b; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  .mark { display: inline-grid; place-items: center; width: 72px; height: 72px; border-radius: 20px; background: #0f6e67; color: #fff; font-size: 36px; margin-bottom: 20px; }
  h1 { font-size: 1.75rem; margin: 0 0 12px; }
  p { font-size: 1.125rem; line-height: 1.5; margin: 0 0 24px; color: #4b6660; }
  button { min-width: 88px; min-height: 88px; padding: 0 32px; border: 0; border-radius: 16px; background: #0f6e67; color: #fff; font-size: 1.25rem; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 4px solid #e8a33d; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">✦</div>
  <h1>You're offline</h1>
  <p>Toolkit needs an internet connection the first time it opens. Tools you have opened before will keep working offline once they're loaded.</p>
  <button type="button" onclick="location.replace('https://tools.dunns.cc/')">Try again</button>
</main>
</body>
</html>
